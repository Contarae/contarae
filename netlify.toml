[build]
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  CI = "false"
  DISABLE_ESLINT_PLUGIN = "true"
  GENERATE_SOURCEMAP = "false"

[functions]
  included_files = ["netlify/functions/assets/**"]

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://checkout.wompi.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://checkout.wompi.co https://production.wompi.co https://sandbox.wompi.co; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com https://www.googletagmanager.com https://checkout.wompi.co https://production.wompi.co https://sandbox.wompi.co; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.wompi.co https://production.wompi.co https://sandbox.wompi.co; frame-ancestors 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"

[[edge_functions]]
  path = "/*"
  function = "share-meta"
  excludedPath = ["/static/*", "/api/*", "/.netlify/*", "/*.png", "/*.jpg", "/*.jpeg", "/*.ico", "/*.webp", "/*.svg", "/*.txt", "/*.xml", "/*.json", "/*.pdf"]

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/certificacion-de-ingresos"
  to = "/certificacion"
  status = 301
  force = true

